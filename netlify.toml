# Netlify publica la carpeta raíz tal cual (no hay paso de compilación).
[build]
  publish = "."
  command = "npm test"

[build.environment]
  NODE_VERSION = "22"

# El service worker no debe quedar en caché del navegador, para que las actualizaciones lleguen.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
